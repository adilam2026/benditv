services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: recofiable
      POSTGRES_PASSWORD: recofiable
      POSTGRES_DB: recofiable
    ports:
      - "5432:5432"
    volumes:
      - recofiable_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recofiable"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  recofiable_pgdata:
